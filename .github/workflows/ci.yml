# 持续集成（CI）：每次推送代码或提 PR，GitHub 自动在一台干净的机器上安装依赖、跑全部离线测试、
# 打包前端、构建 Docker 镜像。任何一步失败，GitHub 上会显示红叉，防止把改坏的代码合进主分支。
# 离线测试用 FakeLLM，不调用真实模型，不需要 API Key。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 离线测试
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 打包前端
        working-directory: frontend
        run: npm ci && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Docker 镜像
        run: docker build -t ecommerce-analyst .
